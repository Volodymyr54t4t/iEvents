<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід / Реєстрація - iEvents</title>
    <link rel="icon" href="images/iEvents_logo.png" type="image/png">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/page-spacing.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#317EFB">

    <script src="js/config.js"></script>
</head>

<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-overlay-content">
            <h2 id="overlayTitle">❌ Невдала спроба входу</h2>
            <p id="overlayMessage">
                Це нормально помилятися — перевір email і пароль ще раз.
            </p>
            <p class="overlay-tip">
                Маленькі кроки ведуть до великих результатів. Ти впораєшся 💪
            </p>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="logo">🎯 iEvents</h1>
                <p class="subtitle">Платформа для організації подій</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="login">Вхід</button>
                <button class="tab" data-tab="register">Реєстрація</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" id="loginSubmit" class="btn btn-primary">Увійти</button>
                <div id="loginError" class="error-message"></div>
                <div id="loginLockInfo" class="lock-message"></div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" required placeholder="••••••••" minlength="6">
                </div>
                <div class="form-group">
                    <label for="registerConfirmPassword">Підтвердіть пароль</label>
                    <input type="password" id="registerConfirmPassword" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Зареєструватися</button>
                <div id="registerError" class="error-message"></div>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
